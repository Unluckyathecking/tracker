name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # javacv-platform pulls large multi-platform native jars on a cold cache;
    # the maven cache below makes warm runs fast but the first run is slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Only the Maven rebuild under src/ is CI-testable. The legacy Ant /
      # SwingJS builds (build-*.xml) depend on an external OSP resources
      # checkout and the manual release pipeline in deployment_tasks.txt,
      # so they cannot run here.
      - name: Run tests
        run: mvn -B test
